<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 752" width="960" height="752" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">SEC Financial Agent architecture</title>
  <desc id="desc">Structured SEC data flows into a DuckDB table and Oracle's 10-K flows into a Chroma index. An agent loop uses a language model to choose between a SQL tool and a filing search tool, then answers with figures and citations. A controls panel lists the safeguards.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7a8c"/>
    </marker>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Menlo, Consolas, "Courier New", monospace; }
      .ink { fill: #1d2a3a; }
      .muted { fill: #55657a; }
      .body { fill: #3a4a5c; font-size: 12px; }
      .box { fill: #f3f6f9; stroke: #c9d3dd; }
      .flow { stroke: #6b7a8c; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="960" height="752" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" class="sans ink" font-size="24" font-weight="700">SEC Financial Agent: architecture</text>
  <text x="40" y="64" class="sans muted" font-size="13.5">Figures come from a SQL table built from SEC data. Explanations come from the 10-K. The agent decides which it needs.</text>

  <!-- Column headers -->
  <text x="40" y="90" class="sans" font-size="13" font-weight="700" fill="#3b5b7a">Structured data</text>
  <text x="340" y="90" class="sans" font-size="13" font-weight="700" fill="#9a6b2f">Language model</text>
  <text x="660" y="90" class="sans" font-size="13" font-weight="700" fill="#2c6e6e">Documents</text>

  <!-- Structured data column -->
  <rect x="40" y="100" width="260" height="52" rx="6" class="box"/>
  <rect x="40" y="100" width="4" height="52" fill="#3b5b7a"/>
  <text x="58" y="121" class="sans ink" font-size="13" font-weight="700">Company facts API</text>
  <text x="58" y="139" class="sans body">data.sec.gov XBRL figures</text>

  <rect x="40" y="174" width="260" height="52" rx="6" class="box"/>
  <rect x="40" y="174" width="4" height="52" fill="#3b5b7a"/>
  <text x="58" y="195" class="mono ink" font-size="12" font-weight="700">get_facts(cik)</text>
  <text x="58" y="213" class="sans body">Raw facts, fetched once per company</text>

  <rect x="40" y="248" width="260" height="52" rx="6" class="box"/>
  <rect x="40" y="248" width="4" height="52" fill="#3b5b7a"/>
  <text x="58" y="269" class="mono ink" font-size="12" font-weight="700">get_annual(), get_revenue()</text>
  <text x="58" y="287" class="sans body">Cleaning rules, revenue tag priority</text>

  <rect x="40" y="322" width="260" height="52" rx="6" class="box"/>
  <rect x="40" y="322" width="4" height="52" fill="#3b5b7a"/>
  <text x="58" y="343" class="sans ink" font-size="13" font-weight="700">DuckDB table: financials</text>
  <text x="58" y="361" class="sans body">One row per company per fiscal year</text>

  <line x1="170" y1="153" x2="170" y2="171" class="flow" marker-end="url(#arrow)"/>
  <line x1="170" y1="227" x2="170" y2="245" class="flow" marker-end="url(#arrow)"/>
  <line x1="170" y1="301" x2="170" y2="319" class="flow" marker-end="url(#arrow)"/>

  <!-- Documents column -->
  <rect x="660" y="100" width="260" height="52" rx="6" class="box"/>
  <rect x="660" y="100" width="4" height="52" fill="#2c6e6e"/>
  <text x="678" y="121" class="sans ink" font-size="13" font-weight="700">Filings API</text>
  <text x="678" y="139" class="sans body">data.sec.gov submissions list</text>

  <rect x="660" y="174" width="260" height="52" rx="6" class="box"/>
  <rect x="660" y="174" width="4" height="52" fill="#2c6e6e"/>
  <text x="678" y="195" class="sans ink" font-size="13" font-weight="700">10-K to plain text</text>
  <text x="678" y="213" class="sans body">Oracle's latest 10-K, tags removed</text>

  <rect x="660" y="248" width="260" height="52" rx="6" class="box"/>
  <rect x="660" y="248" width="4" height="52" fill="#2c6e6e"/>
  <text x="678" y="269" class="mono ink" font-size="12" font-weight="700">chunk_text()</text>
  <text x="678" y="287" class="sans body">1,200 characters, 200 overlap</text>

  <rect x="660" y="322" width="260" height="52" rx="6" class="box"/>
  <rect x="660" y="322" width="4" height="52" fill="#2c6e6e"/>
  <text x="678" y="343" class="sans ink" font-size="13" font-weight="700">Chroma index: orcl_10k</text>
  <text x="678" y="361" class="sans body">Local embeddings, chunk metadata</text>

  <line x1="790" y1="153" x2="790" y2="171" class="flow" marker-end="url(#arrow)"/>
  <line x1="790" y1="227" x2="790" y2="245" class="flow" marker-end="url(#arrow)"/>
  <line x1="790" y1="301" x2="790" y2="319" class="flow" marker-end="url(#arrow)"/>

  <!-- Language model column -->
  <rect x="340" y="100" width="280" height="126" rx="6" fill="#faf7f1" stroke="#e2d6bf"/>
  <rect x="340" y="100" width="4" height="126" fill="#9a6b2f"/>
  <text x="358" y="124" class="sans ink" font-size="14" font-weight="700">LLM</text>
  <text x="358" y="148" class="sans body">Anthropic Messages API format</text>
  <text x="358" y="166" class="sans body">Reached through an Open WebUI gateway</text>
  <text x="358" y="184" class="sans body">Returns structured JSON and tool calls</text>
  <text x="358" y="202" class="sans body">No direct access to data or code</text>

  <rect x="340" y="262" width="220" height="112" rx="6" class="box"/>
  <rect x="340" y="262" width="4" height="112" fill="#9a6b2f"/>
  <text x="358" y="286" class="mono ink" font-size="11.5" font-weight="700">summarize_company()</text>
  <text x="358" y="304" class="mono ink" font-size="11.5" font-weight="700">check_summary()</text>
  <text x="358" y="330" class="sans body">JSON summary per company,</text>
  <text x="358" y="348" class="sans body">checked against the database</text>

  <line x1="450" y1="227" x2="450" y2="259" class="flow" marker-end="url(#arrow)"/>
  <line x1="301" y1="348" x2="337" y2="348" class="flow" marker-end="url(#arrow)"/>

  <!-- LLM to agent -->
  <line x1="596" y1="227" x2="596" y2="406" stroke="#9a6b2f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="604" y="318" class="sans muted" font-size="11">each step</text>

  <!-- Agent -->
  <rect x="40" y="410" width="880" height="166" rx="8" fill="#ffffff" stroke="#1d2a3a" stroke-width="1.5"/>
  <text x="480" y="436" class="sans ink" font-size="16" font-weight="700" text-anchor="middle">Agent <tspan class="mono" font-size="13" font-weight="400">run_agent(question)</tspan></text>
  <text x="480" y="455" class="sans muted" font-size="12" text-anchor="middle">The model picks a tool, code runs it, and the result goes back.</text>
  <text x="480" y="471" class="sans muted" font-size="12" text-anchor="middle">Up to 6 steps, each one logged as a trace.</text>

  <rect x="64" y="484" width="266" height="76" rx="6" class="box"/>
  <text x="80" y="510" class="mono ink" font-size="12" font-weight="700">query_financials(sql)</text>
  <text x="80" y="532" class="sans body">Read-only SQL on the financials table</text>
  <text x="80" y="550" class="sans body">Errors go back so the model can retry</text>

  <rect x="360" y="484" width="240" height="76" rx="6" fill="#f4f8f5" stroke="#b8d0c0"/>
  <text x="376" y="510" class="sans ink" font-size="13" font-weight="700">Answer</text>
  <text x="376" y="532" class="sans body">Figures from SQL,</text>
  <text x="376" y="550" class="sans body">explanations cited by chunk</text>

  <rect x="630" y="484" width="266" height="76" rx="6" class="box"/>
  <text x="646" y="510" class="mono ink" font-size="12" font-weight="700">search_filing(query)</text>
  <text x="646" y="532" class="sans body">Top 4 chunks from the 10-K,</text>
  <text x="646" y="550" class="sans body">numbered for citations</text>

  <line x1="331" y1="522" x2="357" y2="522" class="flow" marker-end="url(#arrow)"/>
  <line x1="629" y1="522" x2="603" y2="522" class="flow" marker-end="url(#arrow)"/>

  <!-- Data sources into tools -->
  <line x1="196" y1="375" x2="196" y2="481" stroke="#3b5b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="764" y1="375" x2="764" y2="481" stroke="#2c6e6e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Controls -->
  <rect x="40" y="600" width="880" height="112" fill="#f4f8f5"/>
  <rect x="40" y="600" width="4" height="112" fill="#2f6b4f"/>
  <text x="64" y="628" class="sans ink" font-size="15" font-weight="700">Controls</text>

  <circle cx="69" cy="650" r="4" fill="#2f6b4f"/>
  <text x="80" y="654" class="sans body">Cleaning rules and revenue tag priority</text>
  <circle cx="69" cy="672" r="4" fill="#2f6b4f"/>
  <text x="80" y="676" class="sans body">Duplicate-data guard after every fetch</text>
  <circle cx="69" cy="694" r="4" fill="#2f6b4f"/>
  <text x="80" y="698" class="sans body">Read-only SQL guard and a 6-step limit</text>

  <circle cx="489" cy="650" r="4" fill="#2f6b4f"/>
  <text x="500" y="654" class="sans body">Answers from excerpts only, with chunk citations</text>
  <circle cx="489" cy="672" r="4" fill="#2f6b4f"/>
  <text x="500" y="676" class="sans body">Format and figure checks on LLM summaries</text>
  <circle cx="489" cy="694" r="4" fill="#2f6b4f"/>
  <text x="500" y="698" class="sans body">Secrets kept in .env, never committed</text>

  <!-- Footer -->
  <text x="40" y="738" class="sans muted" font-size="11.5">Python 3.13, pandas, DuckDB, Chroma, BeautifulSoup, and the Anthropic SDK. Source: SEC EDGAR (data.sec.gov).</text>
</svg>
